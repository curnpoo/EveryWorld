[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = { version = "0.33", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
log = "0.4"

# Bevy compiles slowly in debug; optimize deps even in dev builds.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
# The engine sound runs on the audio thread with a 2.7 ms deadline per block.
[profile.dev.package.ed_engine_audio]
opt-level = 3

# Local fix: Bevy 0.20.1 meshlet prepass reads `flags` without defining it (breaks NormalPrepass/SSAO).
[patch.crates-io]
bevy_pbr = { path = "vendor/bevy_pbr" }
