[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["reference", "spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = { version = "0.33", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
log = "0.4"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
# The prebuilt ISPC texture kernels (intel_tex_2, ed_assets) carry no Mach-O platform load
# command; ld notes it on every link. Harmless (they are plain arm64 objects).
linker_messages = "allow"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
# The engine sound runs on the audio thread with a 2.7 ms deadline per block.
[profile.dev.package.ed_engine_audio]
opt-level = 3
[profile.dev.package.ed_audio]
opt-level = 3
