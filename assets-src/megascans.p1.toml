# Phase 1 Megascans (Fab) pack: the 31 assets downloaded to the local library.
#
#     EW_MEGASCANS_DIR=~/Documents/Megascans/library \
#       ew-bake build assets-src/megascans.p1.toml -o <OUT>/p1.ewpack
#
# The library is never in the repository (the baker refuses a folder inside it) and its path is
# not written here: EW_MEGASCANS_DIR names it. Fab folders are `<fab-uuid>__<slug>`; fab_id is the
# uuid, which find_asset matches inside the folder name. The Megascans id (metadata json) is
# recorded as provenance `megascans-id=`.

[pack]
name = "megascans-p1"
game_packaged = true

[[megascans]]
fab_id = "091b8553-6607-4026-809d-2081621b6a49"
alias = "dry_fallen_leaves"
