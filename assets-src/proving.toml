# Proving ground pack: 27 procedural parts (with LOD chains), 50 materials, the ground slab and
# the 100k-instance layout, with collision for every part and placement. Authored placements
# (the planter bench, the character spawn marker, a few props) live in the layer files under
# assets-src/layers, not here.
#   cargo run --release -p ed_assets --bin ew-bake -- build assets-src/proving.toml -o target/packs/proving.ewpack
[pack]
name = "proving"

[proving]
registry = "everyworld-original"
