name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: dependency rules
        run: cargo xtask check-deps
      - name: licence gate
        run: cargo xtask licence-gate
      - name: credits up to date
        run: cargo xtask credits --check
      - name: cargo test --workspace
        run: cargo test --workspace --locked
      - name: determinism (golden hashes)
        run: cargo xtask golden
