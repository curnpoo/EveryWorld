[package]
name = "ed_game"
version.workspace = true
edition.workspace = true
default-run = "earthdrop"

[[bin]]
name = "earthdrop"
path = "src/main.rs"

[features]
default = ["meshlet"]
meshlet = ["bevy/meshlet", "bevy/meshlet_processor"]

[[bin]]
name = "meshlet_probe"
path = "src/bin/meshlet_probe.rs"
required-features = ["meshlet"]

[dependencies]
ed_geo = { path = "../ed_geo" }
ed_data = { path = "../ed_data" }
ed_world = { path = "../ed_world" }
ed_flight = { path = "../ed_flight" }
ed_space = { path = "../ed_space" }
ed_engine_audio = { path = "../ed_engine_audio" }
ed_audio = { path = "../ed_audio" }
serde = { workspace = true }
serde_json = { workspace = true }
ed_runtime = { path = "../ed_runtime" }
bevy = { version = "0.20", features = ["system_font_discovery"] }
avian3d = "0.8"
glam = { workspace = true }
crossbeam-channel = "0.5"
log = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
ed_metal = { path = "../ed_metal" }
raw-window-handle = "0.6"
