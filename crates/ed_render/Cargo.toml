[package]
name = "ed_render"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Vulkan backend passthrough (P1-D22, off by default); pick it at run time with ED_GPU_BACKEND=vulkan.
vulkan = ["ed_gpu/vulkan"]

[dependencies]
ed_geo = { path = "../ed_geo" }
ed_gpu = { path = "../ed_gpu" }
ed_pack = { path = "../ed_pack" }
ed_planet = { path = "../ed_planet" }
glam = { workspace = true }

[dev-dependencies]
# Tests bake real BC7/BC5 textures with the asset pipeline (dev-only; not a runtime dep).
ed_assets = { path = "../ed_assets" }
# The atmosphere captures (tests/render_atmos.rs, ED_ATMOS_SHOTS) are written as PNG.
png = "0.18"
