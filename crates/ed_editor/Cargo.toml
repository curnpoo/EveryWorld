[package]
name = "ed_editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# The full allowed list (xtask/deps.toml) also has ed_planet, ed_world and ed_sim; stage E1
# needs none of them, so they are not linked yet.
[features]
# Vulkan backend passthrough (P1-D22, off by default); pick it at run time with ED_GPU_BACKEND=vulkan.
vulkan = ["ed_gpu/vulkan", "ed_render/vulkan"]

[dependencies]
ed_geo = { path = "../ed_geo" }
ed_pack = { path = "../ed_pack" }
ed_render = { path = "../ed_render" }
# The egui painter (P1-D14) draws through the public ed_gpu interface only. Needs
# `ed_gpu` in `allow.ed_editor` (xtask/deps.toml).
ed_gpu = { path = "../ed_gpu" }
glam = { workspace = true }
thiserror = { workspace = true }
# Developer and editor UI (P1-D14). MIT OR Apache-2.0. Pinned; default_fonts for text.
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }

[dev-dependencies]
# Writes target/editor/panel.png in the headless painter test. MIT OR Apache-2.0.
png = "0.18"
