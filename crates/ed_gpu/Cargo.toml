[package]
name = "ed_gpu"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Second backend (P1-D22): Vulkan through ash. Off by default; on macOS it runs on MoltenVK.
vulkan = ["dep:ash"]

[dependencies]
ash = { version = "0.38", optional = true }

# Metal backend (P1-D2): objc2 bindings inside the private `metal` module only.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = { version = "0.3", features = ["dispatch2"] }
objc2-quartz-core = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
dispatch2 = "0.3"
