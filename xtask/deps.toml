# Workspace dependency rules (docs/ARCHITECTURE.md section 3).
# `allow.<crate>` is the complete list of workspace crates it may depend on directly.
# `forbid` lists edges that must not exist even transitively.
# `cargo xtask check-deps` fails on any edge outside these rules.

[allow]
ed_geo = []
ed_data = ["ed_geo"]
ed_world = ["ed_geo", "ed_data"]
ed_flight = ["ed_geo"]
ed_space = ["ed_geo"]
ed_engine_audio = []
ed_audio = ["ed_world"]
ed_runtime = ["ed_geo"]
ed_net = ["ed_geo"]
ed_pack = ["ed_geo"]
ed_assets = ["ed_geo", "ed_data", "ed_world", "ed_pack"]
ed_planet = ["ed_geo", "ed_pack", "ed_runtime", "ed_space"]
ed_gpu = []
ed_render = ["ed_geo", "ed_gpu", "ed_pack", "ed_planet"]
ed_sim = ["ed_geo", "ed_flight", "ed_space"]
ed_anim = ["ed_geo", "ed_pack"]
ed_editor = ["ed_geo", "ed_pack", "ed_planet", "ed_render", "ed_world", "ed_sim", "ed_gpu"]
ed_store = ["ed_geo", "ed_pack"]
ed_tiles = ["ed_geo", "ed_data", "ed_world", "ed_pack", "ed_assets"]
ed_server = ["ed_geo", "ed_net", "ed_sim", "ed_store", "ed_world", "ed_planet", "ed_pack"]
ew = ["ed_geo", "ed_data", "ed_world", "ed_pack", "ed_planet", "ed_gpu", "ed_render", "ed_sim", "ed_anim", "ed_editor", "ed_store", "ed_net", "ed_runtime", "ed_flight", "ed_space", "ed_audio", "ed_engine_audio", "ed_assets"]
xtask = []

[[forbid]]
from = ["ed_sim", "ed_server", "ed_tiles", "ed_store", "ed_net"]
to = ["ed_gpu", "ed_render", "ed_anim", "ed_editor"]
why = "Simulation, servers and stores run headless; they never link render code."

[[forbid]]
from = ["ed_planet", "ed_render", "ed_sim", "ed_net", "ed_store", "ed_pack", "ed_gpu", "ed_anim"]
to = ["ed_data"]
why = "Only ed_data knows slippy tiles and source formats; runtime crates speak NodeId and read packs. (The editor, tile service and server may link ed_world, which reads ed_data, to regenerate nodes.)"

# External crates that must not appear anywhere in the graph.
[banned_external]
crates = ["bevy", "bevy_pbr", "avian3d", "wgpu"]
why = "D1: custom engine. New renderer code targets ed_gpu only."
